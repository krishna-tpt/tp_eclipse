<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timesheet Entry</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; padding: 24px; }
  .card { max-width: 900px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 10px;
          box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  h2 { margin-top: 0; }
  h3 { margin: 24px 0 8px; font-size: 16px; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 14px; }
  select, input[type=text], textarea { width: 100%; padding: 8px; border: 1px solid #bbb;
          border-radius: 6px; font-size: 14px; box-sizing: border-box; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .labelrow { display: flex; justify-content: space-between; align-items: flex-end; }
  .labelrow label.chk { font-weight: 400; font-size: 13px; color: #444; cursor: pointer; margin-bottom: 4px; }
  .labelrow label.chk input { margin-right: 4px; vertical-align: middle; }
  .datebox { position: relative; display: flex; gap: 6px; }
  .datebox button { margin: 0; width: 44px; padding: 0; background: #eee; color: #333; border: 1px solid #bbb; }
  #datePicker { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  button { margin-top: 20px; width: 100%; padding: 10px; background: #714b67; color: #fff; border: 0;
           border-radius: 6px; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  #msg { margin-top: 14px; padding: 10px; border-radius: 6px; display: none; font-size: 14px; }
  .ok { background: #e3f6e8; color: #1b6b32; }
  .err { background: #fde8e8; color: #9b1c1c; }
  .hint { font-size: 12px; color: #555; margin-top: 4px; min-height: 16px; }
  .hint.bad { color: #9b1c1c; }
  .hint.good { color: #1b6b32; }

  /* Day summary */
  .summary { display: flex; gap: 12px; flex-wrap: wrap; }
  .box { flex: 1; min-width: 220px; background: #f7f3f6; border: 1px solid #e3d6df; border-radius: 8px; padding: 10px 12px; }
  .box .t { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: .03em; }
  .box .v { font-size: 22px; font-weight: 700; margin: 2px 0; }
  .box .s { font-size: 13px; color: #555; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
  th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #eee; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.act { white-space: nowrap; }
  tfoot td { font-weight: 700; background: #f7f7f7; }
  tr.editing td { background: #fffbe6; }
  td select, td textarea, td input[type=text] { font-size: 13px; padding: 5px; }
  td textarea { min-width: 220px; }
  td input.hrs { width: 70px; text-align: right; }
  .muted { color: #777; font-size: 13px; }
  .refresh { width: auto; margin: 0 0 0 8px; padding: 2px 10px; font-size: 12px; background: #eee; color: #333; border: 1px solid #bbb; }
  .mini { width: auto; margin: 0 4px 0 0; padding: 4px 10px; font-size: 12px; }
  .mini.cancel { background: #eee; color: #333; border: 1px solid #bbb; }
</style>
</head>
<body>
<div class="card">
  <h2>Timesheet Entry</h2>

  <label for="project">Project</label>
  <select id="project"><option>Loading...</option></select>

  <div class="labelrow">
    <label for="task">Task</label>
    <label class="chk"><input type="checkbox" id="showDone"> Show Done tasks</label>
  </div>
  <select id="task" disabled><option>Select a project first</option></select>

  <label for="activity">Activity</label>
  <select id="activity"><option>Loading...</option></select>

  <div class="row">
    <div>
      <label for="date">Date (DD/MM/YYYY)</label>
      <div class="datebox">
        <input type="text" id="date" placeholder="DD/MM/YYYY" maxlength="10" autocomplete="off">
        <button type="button" id="calBtn" title="Pick a date">&#128197;</button>
        <input type="date" id="datePicker" tabindex="-1">
      </div>
    </div>
    <div>
      <label for="hours">Hours (H.MM)</label>
      <input type="text" id="hours" inputmode="decimal" placeholder="2.30" autocomplete="off">
      <div class="hint" id="hoursHint"></div>
    </div>
  </div>

  <label for="desc">Description</label>
  <textarea id="desc" rows="3" placeholder="What did you work on?"></textarea>

  <button id="save">Save Timesheet</button>
  <div id="msg"></div>

  <h3>Day summary <button type="button" class="refresh" id="refresh">Refresh</button></h3>
  <div class="summary">
    <div class="box">
      <div class="t">Attendance (after 30 min break)</div>
      <div class="v" id="attNet">-</div>
      <div class="s" id="attInfo">Loading...</div>
    </div>
    <div class="box">
      <div class="t">Timesheet logged</div>
      <div class="v" id="tsTotal">-</div>
      <div class="s" id="tsInfo">Loading...</div>
    </div>
  </div>

  <h3>Timesheets on this date</h3>
  <div class="hint" id="editMsg"></div>
  <div id="tableWrap"><div class="muted">Loading...</div></div>
</div>

<script>
const $ = id => document.getElementById(id);

// Defaults preselected on page load (you can change them in the dropdowns)
const DEFAULT_PROJECT_ID = "27";    // Michelin Camso Support
const DEFAULT_ACTIVITY_ID = "29";   // Implementation

let activitiesCache = [];   // activity list, reused by the inline edit rows
let lastRows = [];          // timesheet rows of the selected date
let editingId = null;       // id of the row that is currently in edit mode

// ---------- helpers ----------

// Fetch JSON and throw the server error message on failure
async function getJson(url, opts) {
  const r = await fetch(url, opts);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}

// Fill a dropdown with items, label comes from labelFn
function fill(select, items, labelFn, placeholder) {
  select.innerHTML = "";
  const first = document.createElement("option");
  first.value = "";
  first.textContent = placeholder;
  select.appendChild(first);
  items.forEach(it => {
    const o = document.createElement("option");
    o.value = it.id;
    o.textContent = labelFn(it);   // textContent avoids HTML injection
    select.appendChild(o);
  });
}

// Select a value only when that option exists in the dropdown
function selectIfExists(select, value) {
  if (value !== null && value !== undefined && value !== "" &&
      Array.prototype.some.call(select.options, o => o.value === String(value))) {
    select.value = String(value);
  }
}

function show(text, ok) {
  const m = $("msg");
  m.textContent = text;
  m.className = ok ? "ok" : "err";
  m.style.display = "block";
}

// Message line above the table (used by the inline edit)
function setEditMsg(text, ok) {
  const el = $("editMsg");
  el.textContent = text;
  el.className = "hint" + (text ? (ok ? " good" : " bad") : "");
}

const pad = n => String(n).padStart(2, "0");

// DD/MM/YYYY -> YYYY-MM-DD (null when invalid)
function dmyToIso(s) {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s.trim());
  if (!m) return null;
  const d = +m[1], mo = +m[2], y = +m[3];
  const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return y + "-" + pad(mo) + "-" + pad(d);
}

// YYYY-MM-DD -> DD/MM/YYYY
function isoToDmy(s) {
  const p = s.split("-");
  return p[2] + "/" + p[1] + "/" + p[0];
}

// ---------- ONE time format everywhere: H.MM (8.30 = 8 hours 30 minutes) ----------

// Total minutes -> "8.30"
function fmtHM(totalMin) {
  return Math.floor(totalMin / 60) + "." + pad(totalMin % 60);
}

// Decimal hours coming from Odoo (8.5) -> total minutes (510)
function decToMin(h) {
  return Math.round(h * 60);
}

// Parse the typed value "2.30" (or "2.3", "2") -> { minutes, decimal } or null when invalid
function parseHM(s) {
  s = s.trim().replace(",", ".");
  const m = /^(\d{1,2})(?:\.(\d{1,2}))?$/.exec(s);
  if (!m) return null;
  const h = +m[1];
  // "2.3" means 2.30, so the minutes are padded to two digits on the right
  const mm = m[2] === undefined ? 0 : +(m[2].padEnd(2, "0"));
  if (mm > 59) return null;
  const total = h * 60 + mm;
  if (total <= 0) return null;
  return { minutes: total, decimal: total / 60 };
}

// Decimal hours sent to Odoo (2.30 typed -> 2.5)
function toOdooHours(hm) {
  return String(Math.round(hm.decimal * 1e6) / 1e6);
}

// Live hint under the hours field
$("hours").addEventListener("input", () => {
  const hint = $("hoursHint");
  const v = $("hours").value;
  if (!v.trim()) { hint.textContent = ""; hint.className = "hint"; return; }
  const p = parseHM(v);
  if (p) {
    hint.textContent = "= " + Math.floor(p.minutes / 60) + "h " + pad(p.minutes % 60) + "m";
    hint.className = "hint";
  } else {
    hint.textContent = "Use H.MM, minutes 00-59 (example 2.30 = 2h 30m)";
    hint.className = "hint bad";
  }
});

// ---------- date field ----------

const dateEl = $("date");
const t = new Date();
dateEl.value = pad(t.getDate()) + "/" + pad(t.getMonth() + 1) + "/" + t.getFullYear();

// Auto insert the slashes while typing
dateEl.addEventListener("input", () => {
  let v = dateEl.value.replace(/\D/g, "").slice(0, 8);
  if (v.length > 4) v = v.slice(0, 2) + "/" + v.slice(2, 4) + "/" + v.slice(4);
  else if (v.length > 2) v = v.slice(0, 2) + "/" + v.slice(2);
  dateEl.value = v;
  if (v.length === 10) { setEditMsg("", true); loadDay(); }
});

// Calendar button opens the native picker, the value is shown as DD/MM/YYYY
$("calBtn").addEventListener("click", () => {
  const p = $("datePicker");
  p.value = dmyToIso(dateEl.value) || "";
  if (p.showPicker) p.showPicker(); else p.click();
});
$("datePicker").addEventListener("change", () => {
  if ($("datePicker").value) {
    dateEl.value = isoToDmy($("datePicker").value);
    setEditMsg("", true);
    loadDay();
  }
});

// ---------- day summary ----------

let dayToken = 0;   // ignore stale responses when the date changes quickly

async function loadDay() {
  const iso = dmyToIso(dateEl.value);
  if (!iso) return;
  const token = ++dayToken;
  try {
    const d = await getJson("api/day?date=" + iso);
    if (token !== dayToken) return;
    renderDay(d);
  } catch (e) {
    if (token !== dayToken) return;
    show(e.message, false);
  }
}

function renderDay(d) {
  // Attendance box (H.MM)
  const a = d.attendance || {};
  if (a.found) {
    const incompleteOnly = a.incomplete && a.grossMinutes === 0;
    $("attNet").textContent = incompleteOnly ? "-" : fmtHM(a.netMinutes) + " Hrs";
    let info = "In " + a.firstIn;
    if (a.open) info += " | Out: not yet (now " + a.nowTime + ")";
    else if (a.lastOut) info += " | Out " + a.lastOut;
    if (a.incomplete) info += " | Out time missing in some entries";
    if (!incompleteOnly) info += " | Gross " + fmtHM(a.grossMinutes) + " - " + fmtHM(a.breakMinutes) + " break";
    $("attInfo").textContent = info;
  } else {
    $("attNet").textContent = "-";
    $("attInfo").textContent = a.note || "No attendance record for this date";
  }

  // Timesheet rows in minutes, so the table total and the box total always match
  lastRows = d.timesheets || [];
  const totalMin = lastRows.reduce((s, r) => s + decToMin(r.hours), 0);
  $("tsTotal").textContent = lastRows.length ? fmtHM(totalMin) + " Hrs" : "0.00 Hrs";
  $("tsInfo").textContent = lastRows.length + (lastRows.length === 1 ? " entry" : " entries");

  editingId = null;   // a fresh load always leaves edit mode
  renderTable();
}

$("refresh").addEventListener("click", () => { setEditMsg("", true); loadDay(); });

// ---------- timesheet table with inline edit ----------

function renderTable() {
  const wrap = $("tableWrap");
  wrap.innerHTML = "";
  if (!lastRows.length) {
    const p = document.createElement("div");
    p.className = "muted";
    p.textContent = "No timesheet entries for this date.";
    wrap.appendChild(p);
    return;
  }

  const table = document.createElement("table");
  const head = table.createTHead().insertRow();
  ["Project", "Task", "Activity", "Description", "Hrs (H.MM)", ""].forEach((h, i) => {
    const th = document.createElement("th");
    th.textContent = h;
    if (i === 4) th.className = "num";
    head.appendChild(th);
  });

  const body = table.createTBody();
  let totalMin = 0;
  lastRows.forEach(r => {
    const min = decToMin(r.hours);
    totalMin += min;
    const tr = body.insertRow();
    if (r.id === editingId) {
      tr.className = "editing";
      buildEditRow(tr, r, min);
    } else {
      buildViewRow(tr, r, min);
    }
  });

  const foot = table.createTFoot().insertRow();
  const label = foot.insertCell();
  label.colSpan = 4;
  label.textContent = "Total";
  const tot = foot.insertCell();
  tot.className = "num";
  tot.textContent = fmtHM(totalMin);
  foot.insertCell();
  wrap.appendChild(table);
}

// Normal (read only) row with an Edit button
function buildViewRow(tr, r, min) {
  [r.project, r.task, r.activity, r.description].forEach(v => {
    tr.insertCell().textContent = v;
  });
  const hc = tr.insertCell();
  hc.className = "num";
  hc.textContent = fmtHM(min);

  const ac = tr.insertCell();
  ac.className = "act";
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "mini";
  btn.textContent = "Edit";
  btn.addEventListener("click", () => {
    editingId = r.id;     // only one row is edited at a time
    setEditMsg("", true);
    renderTable();
  });
  ac.appendChild(btn);
}

// Editable row: project stays read only, the rest can be changed
function buildEditRow(tr, r, min) {
  tr.insertCell().textContent = r.project;   // project cannot be changed

  const taskSel = document.createElement("select");
  fill(taskSel, [], x => x, "Loading tasks...");
  tr.insertCell().appendChild(taskSel);

  const actSel = document.createElement("select");
  fill(actSel, activitiesCache, a => a.name, "-- none --");
  selectIfExists(actSel, r.activityId);
  tr.insertCell().appendChild(actSel);

  const descEl = document.createElement("textarea");
  descEl.rows = 3;
  descEl.value = r.description;
  tr.insertCell().appendChild(descEl);

  const hrsEl = document.createElement("input");
  hrsEl.type = "text";
  hrsEl.className = "hrs";
  hrsEl.value = fmtHM(min);
  const hc = tr.insertCell();
  hc.className = "num";
  hc.appendChild(hrsEl);

  const ac = tr.insertCell();
  ac.className = "act";
  const saveBtn = document.createElement("button");
  saveBtn.type = "button";
  saveBtn.className = "mini";
  saveBtn.textContent = "Save";
  const cancelBtn = document.createElement("button");
  cancelBtn.type = "button";
  cancelBtn.className = "mini cancel";
  cancelBtn.textContent = "Cancel";
  ac.appendChild(saveBtn);
  ac.appendChild(cancelBtn);

  cancelBtn.addEventListener("click", () => {
    editingId = null;
    setEditMsg("", true);
    renderTable();
  });
  saveBtn.addEventListener("click", () => saveEdit(r, taskSel, actSel, descEl, hrsEl, saveBtn));

  loadEditTasks(taskSel, r);
}

// Tasks of the entry's project for the edit dropdown
async function loadEditTasks(sel, r) {
  try {
    // includeDone=true so a task that is already in the Done stage stays selectable
    const tasks = await getJson("api/tasks?projectId=" + r.projectId + "&includeDone=true");
    fill(sel, tasks, k => k.name + (k.stage ? "  [" + k.stage + "]" : ""), "-- Select task --");
    // The current task may be in a stage that is not listed: keep it as an option
    if (r.taskId !== null && !Array.prototype.some.call(sel.options, o => o.value === String(r.taskId))) {
      const o = document.createElement("option");
      o.value = r.taskId;
      o.textContent = r.task;
      sel.appendChild(o);
    }
    selectIfExists(sel, r.taskId);
  } catch (e) { setEditMsg(e.message, false); }
}

// Save the edited row to Odoo
async function saveEdit(r, taskSel, actSel, descEl, hrsEl, btn) {
  const hm = parseHM(hrsEl.value);
  if (!hm) {
    setEditMsg("Enter hours as H.MM, minutes 00-59 (example 2.30 = 2h 30m)", false);
    return;
  }
  if (!taskSel.value) {
    setEditMsg("Select a task", false);
    return;
  }
  if (!descEl.value.trim()) {
    setEditMsg("Description is required", false);
    return;
  }
  const body = new URLSearchParams({
    id: r.id,
    taskId: taskSel.value,
    activityId: actSel.value,
    hours: toOdooHours(hm),
    description: descEl.value
  });
  btn.disabled = true;
  try {
    await getJson("api/timesheet/update", { method: "POST", body });
    setEditMsg("Timesheet entry updated (" + fmtHM(hm.minutes) + " Hrs)", true);
    await loadDay();   // refresh the table and totals
  } catch (e) {
    setEditMsg(e.message, false);
    btn.disabled = false;
  }
}

// ---------- tasks (entry form) ----------

// Load the tasks of the selected project; "Show Done tasks" adds the Done stage
async function loadTasks() {
  const pid = $("project").value;
  const taskSel = $("task");
  if (!pid) {
    fill(taskSel, [], x => x, "Select a project first");
    taskSel.disabled = true;
    return;
  }
  const prev = taskSel.value;   // keep the selected task when only the checkbox changes
  taskSel.disabled = true;
  fill(taskSel, [], x => x, "Loading tasks...");
  try {
    const tasks = await getJson("api/tasks?projectId=" + pid + "&includeDone=" + $("showDone").checked);
    fill(taskSel, tasks, k => k.name + (k.stage ? "  [" + k.stage + "]" : ""),
         tasks.length ? "-- Select task --" : "-- No tasks found --");
    selectIfExists(taskSel, prev);
    taskSel.disabled = false;
  } catch (e) { show(e.message, false); }
}

$("project").addEventListener("change", loadTasks);
$("showDone").addEventListener("change", loadTasks);

// ---------- initial load ----------

(async () => {
  try {
    const [projects, activities] = await Promise.all([getJson("api/projects"), getJson("api/activities")]);
    activitiesCache = activities;
    fill($("project"), projects, p => p.name, "-- Select project --");
    fill($("activity"), activities, a => a.name, "-- Select activity --");

    // Preselect the default project and activity, then load the tasks of that project
    selectIfExists($("project"), DEFAULT_PROJECT_ID);
    selectIfExists($("activity"), DEFAULT_ACTIVITY_ID);
    await loadTasks();
  } catch (e) { show(e.message, false); }
})();
loadDay();

// ---------- save (new entry) ----------

$("save").addEventListener("click", async () => {
  const iso = dmyToIso(dateEl.value);
  if (!iso) {
    show("Enter a valid date as DD/MM/YYYY", false);
    return;
  }
  const hm = parseHM($("hours").value);
  if (!hm) {
    show("Enter hours as H.MM, minutes 00-59 (example 2.30 = 2h 30m)", false);
    return;
  }
  const body = new URLSearchParams({
    projectId: $("project").value,
    taskId: $("task").value,
    activityId: $("activity").value,
    date: iso,
    hours: toOdooHours(hm),   // Odoo expects decimal hours (2.30 -> 2.5)
    description: $("desc").value
  });
  if (!body.get("projectId") || !body.get("taskId") || !body.get("description").trim()) {
    show("Project, task, hours and description are required", false);
    return;
  }
  $("save").disabled = true;
  try {
    const r = await getJson("api/timesheet", { method: "POST", body });
    show("Timesheet saved (" + fmtHM(hm.minutes) + " Hrs). Odoo id = " + r.id, true);
    // Keep project/task/activity for the next entry, clear the rest
    $("hours").value = "";
    $("hoursHint").textContent = "";
    $("desc").value = "";
    setEditMsg("", true);
    loadDay();   // refresh the table and totals
  } catch (e) { show(e.message, false); }
  $("save").disabled = false;
});
</script>
</body>
</html>
