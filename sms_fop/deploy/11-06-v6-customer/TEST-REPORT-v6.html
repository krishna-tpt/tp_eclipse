<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inventory Ledger v6 — Test Report</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #1f2937; background: #f3f4f6; }
  header { background: #0f172a; color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .meta { font-size: 12px; opacity: 0.8; }
  .summary { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 12px 20px; display: flex; gap: 24px; align-items: center; }
  .stat { display: flex; flex-direction: column; }
  .stat .num { font-size: 22px; font-weight: 700; }
  .stat .label { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat.pass .num { color: #15803d; }
  .stat.fail .num { color: #b91c1c; }
  .layout { display: flex; height: calc(100vh - 110px); }
  .tree { width: 380px; background: #fff; border-right: 1px solid #e5e7eb; overflow-y: auto; padding: 12px 0; }
  .tree .cat { padding: 8px 16px; font-weight: 600; font-size: 13px; cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f3f4f6; }
  .tree .cat:hover { background: #f9fafb; }
  .tree .cat .arrow { font-size: 10px; color: #9ca3af; transition: transform 0.15s; }
  .tree .cat.collapsed .arrow { transform: rotate(-90deg); }
  .tree .cat .count { font-size: 11px; color: #6b7280; font-weight: 500; }
  .tree .cat .count .p { color: #15803d; }
  .tree .cat .count .f { color: #b91c1c; }
  .tree .tests { list-style: none; padding: 0; margin: 0; }
  .tree .cat.collapsed + .tests { display: none; }
  .tree .test { padding: 7px 16px 7px 32px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; border-left: 3px solid transparent; }
  .tree .test:hover { background: #f9fafb; }
  .tree .test.active { background: #eff6ff; border-left-color: #2563eb; }
  .tree .test .id { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-size: 11px; color: #6b7280; min-width: 80px; }
  .tree .test .label { flex: 1; color: #374151; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 600; letter-spacing: 0.3px; }
  .badge.pass { background: #dcfce7; color: #15803d; }
  .badge.fail { background: #fee2e2; color: #b91c1c; }
  .detail { flex: 1; overflow-y: auto; padding: 28px 36px; }
  .detail .empty { color: #9ca3af; font-size: 14px; text-align: center; padding: 80px 0; }
  .detail h2 { margin: 0 0 4px; font-size: 22px; }
  .detail .category-tag { display: inline-block; background: #eef2ff; color: #4338ca; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
  .detail .scenario { font-size: 15px; color: #4b5563; margin-bottom: 24px; line-height: 1.5; }
  .detail .grid { display: grid; grid-template-columns: 140px 1fr; gap: 14px 18px; background: #fff; padding: 20px 24px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 20px; }
  .detail .grid .key { font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.4px; padding-top: 2px; }
  .detail .grid .val { font-size: 13px; color: #1f2937; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; word-break: break-word; line-height: 1.5; }
  .detail .grid .val.ok { color: #166534; }
  .detail .grid .val.bad { color: #991b1b; }
  .detail .verdict { font-size: 14px; padding: 14px 20px; border-radius: 8px; }
  .detail .verdict.pass { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
  .detail .verdict.fail { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
  .detail .notes { margin-top: 18px; padding: 14px 18px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; font-size: 13px; color: #78350f; line-height: 1.5; }
  .filterbar { padding: 8px 16px; border-bottom: 1px solid #f3f4f6; }
  .filterbar input { width: 100%; padding: 6px 10px; font-size: 13px; border: 1px solid #d1d5db; border-radius: 6px; outline: none; }
  .filterbar input:focus { border-color: #2563eb; }
</style>
</head>
<body>
<header>
  <h1>Inventory Ledger v6 — Test Report</h1>
  <div class="meta">Run 2026-06-15 · postgres:18-alpine · customer backup + alter_01/02/03</div>
</header>

<div class="summary">
  <div class="stat"><span class="num" id="totalNum">32</span><span class="label">Tests</span></div>
  <div class="stat pass"><span class="num" id="passNum">32</span><span class="label">Pass</span></div>
  <div class="stat fail"><span class="num" id="failNum">0</span><span class="label">Fail</span></div>
  <div class="stat"><span class="num" id="catNum">7</span><span class="label">Categories</span></div>
</div>

<div class="layout">
  <aside class="tree" id="tree">
    <div class="filterbar"><input id="filter" placeholder="Filter tests..." type="text"></div>
  </aside>
  <main class="detail" id="detail">
    <div class="empty">Select a test on the left to view details.</div>
  </main>
</div>

<script>
const TESTS = [
  // Basic calculation
  { id: "BC1", category: "Basic calc", title: "Opening balance lands in stock_balance",
    scenario: "Verifies that an opening_balance INSERT creates the matching stock_balance row with the correct on_hand_qty, then that subsequent shipments decrement it correctly.",
    seed: "Product FS-BC-A, subinv ONHAND. Opening balance = 100. ORD-002 ships 2+3=5 against this row.",
    expected: "on_hand = 95",
    got: "on_hand = 95.0000",
    pass: true },

  { id: "BC2", category: "Basic calc", title: "Reservation math (open lines reserve qty − shipped_qty)",
    scenario: "Verifies the reservation accumulator for multiple open lines on the same (product, subinv).",
    seed: "BC-A/ONHAND. ORD-001 (qty=10, no ship) + ORD-002 L1 (qty=5, shipped=2) + ORD-002 L2 (qty=3, fully shipped → closed). Reservation contributions: 10 + (5−2) + 0 = 13.",
    expected: "reserved = 13",
    got: "reserved = 13.0000",
    pass: true },

  { id: "BC3", category: "Basic calc", title: "ATP = on_hand − reserved",
    scenario: "Verifies the derived ATP formula at the row level.",
    seed: "BC-A/ONHAND. on_hand = 95, reserved = 13.",
    expected: "atp = 82",
    got: "atp = 82.0000",
    pass: true },

  { id: "BC4", category: "Basic calc", title: "Different subinventory tracked independently",
    scenario: "Verifies that two subinventories for the same product hold independent on_hand and reserved counters.",
    seed: "BC-A/STAGING. Opening balance = 20. ORD-005 qty=8 shipped 5.",
    expected: "on=15, reserved=3, atp=12",
    got: "on=15.0000, reserved=3.0000, atp=12.0000",
    pass: true },

  { id: "BC5", category: "Basic calc", title: "Different product tracked independently (fully shipped)",
    scenario: "Verifies independent counters across products and a fully shipped flow.",
    seed: "BC-B/ONHAND. Opening balance = 50. ORD-003 qty=15 fully shipped (TXN-003 = -15).",
    expected: "on=35, reserved=0, atp=35",
    got: "on=35.0000, reserved=0.0000, atp=35.0000",
    pass: true },

  { id: "BC6", category: "Basic calc", title: "Different product, open order (no shipment)",
    scenario: "Verifies a clean open-order reservation without any shipment activity.",
    seed: "BC-C/ONHAND. Opening balance = 200. ORD-004 qty=50 open, no ship.",
    expected: "on=200, reserved=50, atp=150",
    got: "on=200.0000, reserved=50.0000, atp=150.0000",
    pass: true },

  // Shipment cascade
  { id: "SC1", category: "Shipment cascade", title: "Partial shipment — line stays open, shipped_qty bumped",
    scenario: "Verifies the partial-shipment cascade: the matched order line's shipped_qty grows but line_state stays 'open' because shipped_qty < qty.",
    seed: "ORD-002 L1 qty=5. TXN-001 ships -2 against erp_line_id=FS-LINE-002-1.",
    expected: "shipped=2, line_state=open",
    got: "shipped=2.0000, line_state=open",
    pass: true },

  { id: "SC2", category: "Shipment cascade", title: "Full shipment closes the line",
    scenario: "Verifies that when shipped_qty reaches qty, line_state flips to 'closed' and the residual reservation is released.",
    seed: "ORD-002 L2 qty=3. TXN-002 ships -3 against erp_line_id=FS-LINE-002-2.",
    expected: "shipped=3, line_state=closed",
    got: "shipped=3.0000, line_state=closed",
    pass: true },

  { id: "SC3", category: "Shipment cascade", title: "Single-line full shipment (clean independent product)",
    scenario: "Verifies the end-to-end full-shipment flow on a product not entangled with other orders.",
    seed: "ORD-003 (BC-B/ONHAND) qty=15. TXN-003 ships -15.",
    expected: "shipped=15, line_state=closed",
    got: "shipped=15.0000, line_state=closed",
    pass: true },

  { id: "SC4", category: "Shipment cascade", title: "Line-precise cascade — unrelated lines untouched",
    scenario: "Verifies that shipments referencing a specific erp_line_id do NOT side-effect any other open line.",
    seed: "ORD-001 (FS-LINE-001-1) and ORD-004 (FS-LINE-004-1) have NO matching txn.",
    expected: "sum(shipped_qty) across ORD-001 & ORD-004 = 0",
    got: "sum=0.0000",
    pass: true },

  { id: "SC5", category: "Shipment cascade", title: "Idempotency — duplicate external_txn_id not double-applied",
    scenario: "Verifies the unique-key guard on processed.inv_transaction: a duplicate staging row promotes but does not create a second processed row.",
    seed: "FS-TXN-001 inserted into staging.txn_inbox twice with identical external_txn_id.",
    expected: "processed.inv_transaction count for FS-TXN-001 = 1",
    got: "count = 1",
    pass: true },

  // Edge cases
  { id: "EC1a", category: "Edge case", title: "Order for product NOT in opening balance — stock_balance row auto-created",
    scenario: "This is the answer to the original question: if the opening balance file only carries A and B but an order arrives for C (and C is in the product master), the reservation trigger lazily creates a stock_balance row for C with on_hand=0.",
    seed: "Product FS-EC-NO-OB exists in processed.product but has NO opening_balance row. Order ORD-EC1 places qty=20 against it.",
    expected: "1 stock_balance row created for FS-EC-NO-OB",
    got: "1 row",
    pass: true,
    notes: "This is the trigger code path f_stock_balance_reservation_apply → INSERT-when-NOT FOUND in customer_install.sql lines 622–651." },

  { id: "EC1b", category: "Edge case", title: "Auto-created row: on_hand=0, reserved=qty, ATP negative",
    scenario: "Verifies the values on that lazily created row — most importantly, that ATP comes out negative so downstream consumers can spot 'we owe units we don't have'.",
    seed: "Same as EC1a. Order qty = 20.",
    expected: "on=0, reserved=20, atp=-20",
    got: "on=0.0000, reserved=20.0000, atp=-20.0000",
    pass: true,
    notes: "fetch_inventory_json('IFOPEUR', NULL, NULL, 'FS-EC-NO-OB') returns this row with atp_qty=-20." },

  { id: "EC2", category: "Edge case", title: "ATP=0 boundary — order qty exactly equals on_hand",
    scenario: "Verifies the boundary where a customer has reserved every available unit. No oversell, but ATP must be exactly 0 (not 0.0001 or -1).",
    seed: "FS-EC-EXACT/ONHAND ob=50. ORD-EC2 qty=50, no shipment.",
    expected: "on=50, reserved=50, atp=0",
    got: "on=50.0000, reserved=50.0000, atp=0.0000",
    pass: true },

  { id: "EC3", category: "Edge case", title: "Oversell — order > on_hand, still accepted, ATP negative",
    scenario: "Verifies that the system does NOT block an oversell at the reservation level. The reservation succeeds and ATP goes negative — this is the trigger for an upstream allocation alarm, not a hard rejection.",
    seed: "FS-EC-OVERSELL/ONHAND ob=30. ORD-EC3 qty=50.",
    expected: "on=30, reserved=50, atp=-20",
    got: "on=30.0000, reserved=50.0000, atp=-20.0000",
    pass: true },

  { id: "EC4", category: "Edge case", title: "Overship — ship more than on_hand → on_hand negative, line closes",
    scenario: "Verifies that an ERP-recorded shipment for more than we believe we hold still applies: on_hand goes negative, and the order line closes because shipped_qty ≥ qty.",
    seed: "FS-EC-OVERSHIP/ONHAND ob=20. Order qty=20. TXN-EC4 ships -25.",
    expected: "on=-5, reserved=0, line_state=closed",
    got: "on=-5.0000, reserved=0.0000, line_state=closed",
    pass: true,
    notes: "Negative on_hand is intentional — the source of truth for inventory is the ledger, not the file manager. The opening balance can be refreshed later via recalculate_stock_balance." },

  { id: "EC5", category: "Edge case", title: "Line inserted as 'cancelled' — no reservation taken",
    scenario: "Verifies that the reservation trigger respects line_state. Active states are {open, synced}; anything else contributes 0 to reservation.",
    seed: "FS-EC-CANCELLED/ONHAND ob=40. ORD-EC5 qty=10 with line_state='cancelled' at INSERT.",
    expected: "on=40, reserved=0",
    got: "on=40.0000, reserved=0.0000",
    pass: true },

  { id: "EC6", category: "Edge case", title: "Empty-string subinventory accepted as a real key",
    scenario: "Verifies that subinventory='' is treated as a valid value (matching the schema default), and reservations land on the empty-string row.",
    seed: "FS-EC-EMPTY/'' ob=70. ORD-EC6 qty=15 with subinventory=''.",
    expected: "on=70, reserved=15, subinv=''",
    got: "on=70.0000, reserved=15.0000, subinv=''",
    pass: true },

  // State transitions
  { id: "ST1+ST2+ST3", category: "State transition", title: "qty up → qty down → cancel releases reservation",
    scenario: "Verifies the delta-based reservation math across multiple UPDATEs to the same line: each transition updates reserved_qty by NEW_target − OLD_target.",
    seed: "FS-LINE-ST1 inserted at qty=10 (reserved=10). UPDATE qty 10→15 (+5), UPDATE qty 15→7 (-8), UPDATE line_state 'open'→'cancelled' (-7). Plus ST4 moved its line out of ONHAND, and ST5 deleted its line. Net reserved on ST-A/ONHAND should be 0.",
    expected: "reserved on ST-A/ONHAND = 0",
    got: "reserved = 0.0000",
    pass: true },

  { id: "ST4", category: "State transition", title: "UPDATE subinventory ONHAND→STAGING moves reservation",
    scenario: "Verifies that an UPDATE which changes subinventory releases on the OLD row and reserves on the NEW row in one transaction.",
    seed: "FS-LINE-ST4 inserted with qty=12 on ONHAND. UPDATE subinventory to 'STAGING'.",
    expected: "STAGING reserved = 12 (and ONHAND lost the 12 — verified via combined ST123 test)",
    got: "STAGING reserved = 12.0000",
    pass: true },

  { id: "ST5", category: "State transition", title: "DELETE order line releases its reservation",
    scenario: "Verifies that the BEFORE-DELETE branch of the reservation trigger releases the line's outstanding reservation.",
    seed: "FS-LINE-ST5 inserted with qty=20 on ONHAND. Then DELETE.",
    expected: "0 rows reference FS-LINE-ST5",
    got: "0 rows",
    pass: true },

  // Negative
  { id: "NC1", category: "Negative", title: "Unknown tenant rejects the inbox row",
    scenario: "Verifies that promote_one_order detects an unknown tenant and marks the inbox row 'rejected' with reason 'unknown_tenant', without creating any downstream rows.",
    seed: "staging.order_inbox row with tenant_code='NOT_A_TENANT'.",
    expected: "status=rejected, reason=unknown_tenant",
    got: "status=rejected, reason=unknown_tenant",
    pass: true },

  { id: "NC2", category: "Negative", title: "Unknown product code in payload rejects the inbox",
    scenario: "Verifies that unknown_product:<code> rejection is emitted by the per-line resolver loop and carries the offending product code.",
    seed: "Payload references product_code='FS-DOES-NOT-EXIST'.",
    expected: "status=rejected, reason ~ 'unknown_product:FS-DOES-NOT-EXIST'",
    got: "status=rejected, reason='line 1: unknown_product:FS-DOES-NOT-EXIST'",
    pass: true },

  { id: "NC3", category: "Negative", title: "Unknown warehouse code rejects the inbox",
    scenario: "Same rejection path as NC2 but for warehouse resolution.",
    seed: "Payload references warehouse_code='WH-DOES-NOT-EXIST'.",
    expected: "status=rejected, reason ~ 'unknown_warehouse:WH-DOES-NOT-EXIST'",
    got: "status=rejected, reason='line 1: unknown_warehouse:WH-DOES-NOT-EXIST'",
    pass: true },

  { id: "NC4", category: "Negative", title: "Unknown UOM rejects the inbox",
    scenario: "Same rejection path as NC2/NC3 but for UOM resolution.",
    seed: "Payload references uom_code='XYZ'.",
    expected: "status=rejected, reason ~ 'unknown_uom:XYZ'",
    got: "status=rejected, reason='line 1: unknown_uom:XYZ'",
    pass: true },

  { id: "NC5", category: "Negative", title: "Rejected inboxes do NOT leak half-formed sfdc_order rows",
    scenario: "Verifies the EXCEPTION-block transactional rollback: any partial work from a failed promote is undone, so processed.sfdc_order stays clean.",
    seed: "4 negative-case inboxes (NC1–NC4) were processed.",
    expected: "0 rows in processed.sfdc_order with sfdc_order_id IN ('FS-ORD-NC1'…'NC4')",
    got: "count = 0",
    pass: true },

  // Inbox state
  { id: "IB1", category: "Inbox state", title: "All non-NC order inboxes reach status=processed",
    scenario: "Smoke check — every order that was supposed to succeed actually did.",
    seed: "14 non-NC orders (5 BC + 6 EC + 3 ST).",
    expected: "14 of 14 status='processed'",
    got: "14 of 14",
    pass: true },

  { id: "IB2", category: "Inbox state", title: "All txn inboxes reach status=processed (incl. duplicate retry)",
    scenario: "Smoke check — every txn inbox row, including the deliberate duplicate of FS-TXN-001, terminates as 'processed'. (The duplicate's downstream insert is silently squashed by the unique key on inv_transaction.)",
    seed: "6 txn inboxes (5 unique + 1 duplicate of FS-TXN-001).",
    expected: "6 of 6 status='processed'",
    got: "6 of 6",
    pass: true },

  // Query/function
  { id: "QC1", category: "Query/function", title: "fetch_inventory_json with all-NULL filters returns every row for the tenant",
    scenario: "Verifies the wildcard path of processed.fetch_inventory_json (NULL parameters = no filter).",
    seed: "12 stock_balance rows exist for IFOPEUR (11 from opening balance + 1 lazily created by EC1).",
    expected: ">= 11 rows",
    got: "12 rows",
    pass: true },

  { id: "QC2", category: "Query/function", title: "Product filter narrows correctly",
    scenario: "Verifies the product_code parameter on fetch_inventory_json.",
    seed: "fetch_inventory_json('IFOPEUR', NULL, NULL, 'FS-BC-A') — BC-A exists on ONHAND and STAGING.",
    expected: "2 rows",
    got: "2 rows",
    pass: true },

  { id: "QC3", category: "Query/function", title: "Non-existent product returns 0 rows (not an error)",
    scenario: "Verifies that asking ATP for a product the system has never seen returns an empty result set rather than throwing.",
    seed: "fetch_inventory_json('IFOPEUR', NULL, NULL, 'NOPE').",
    expected: "0 rows",
    got: "0 rows",
    pass: true },

  { id: "QC4", category: "Query/function", title: "Returns INTEGER quantities (no .0000); key order preserved",
    scenario: "Verifies the formatting contract of alter_03: quantities are cast to INTEGER and the JSON keys appear in the declared order.",
    seed: "fetch_inventory_json('IFOPEUR', 'WH-FS', 'ONHAND', 'FS-BC-A').",
    expected: "on_hand_qty=95, reserved_qty=13, atp_qty=82 (no decimals)",
    got: "on_hand=95, reserved=13, atp=82",
    pass: true }
];

const CATEGORY_ORDER = [
  "Basic calc",
  "Shipment cascade",
  "Edge case",
  "State transition",
  "Negative",
  "Inbox state",
  "Query/function"
];

function render() {
  const tree = document.getElementById("tree");
  const filterEl = document.getElementById("filter");
  const q = filterEl.value.trim().toLowerCase();

  const grouped = {};
  for (const cat of CATEGORY_ORDER) grouped[cat] = [];
  for (const t of TESTS) {
    if (q && !(t.id.toLowerCase().includes(q)
              || t.title.toLowerCase().includes(q)
              || t.category.toLowerCase().includes(q)
              || t.scenario.toLowerCase().includes(q))) continue;
    if (!grouped[t.category]) grouped[t.category] = [];
    grouped[t.category].push(t);
  }

  let html = '<div class="filterbar"><input id="filter" placeholder="Filter tests..." type="text" value="' +
             escapeHtml(filterEl.value) + '"></div>';
  for (const cat of CATEGORY_ORDER) {
    const items = grouped[cat] || [];
    if (q && items.length === 0) continue;
    const pass = items.filter(t => t.pass).length;
    const fail = items.length - pass;
    html += `<div class="cat" data-cat="${cat}">
              <span><span class="arrow">▼</span> ${cat}</span>
              <span class="count"><span class="p">${pass}✓</span>${fail ? ' <span class="f">'+fail+'✗</span>' : ''}</span>
            </div>`;
    html += '<ul class="tests">';
    for (const t of items) {
      html += `<li class="test" data-id="${t.id}">
                 <span class="id">${t.id}</span>
                 <span class="label">${escapeHtml(t.title)}</span>
                 <span class="badge ${t.pass ? 'pass':'fail'}">${t.pass ? 'PASS':'FAIL'}</span>
               </li>`;
    }
    html += '</ul>';
  }
  tree.innerHTML = html;

  document.getElementById("filter").addEventListener("input", e => render());
  tree.querySelectorAll(".cat").forEach(el => {
    el.addEventListener("click", () => el.classList.toggle("collapsed"));
  });
  tree.querySelectorAll(".test").forEach(el => {
    el.addEventListener("click", () => {
      tree.querySelectorAll(".test.active").forEach(a => a.classList.remove("active"));
      el.classList.add("active");
      showDetail(el.dataset.id);
    });
  });

  document.getElementById("totalNum").textContent = TESTS.length;
  document.getElementById("passNum").textContent = TESTS.filter(t => t.pass).length;
  document.getElementById("failNum").textContent = TESTS.filter(t => !t.pass).length;
  document.getElementById("catNum").textContent = new Set(TESTS.map(t => t.category)).size;
}

function showDetail(id) {
  const t = TESTS.find(x => x.id === id);
  if (!t) return;
  const det = document.getElementById("detail");
  det.innerHTML = `
    <div class="category-tag">${escapeHtml(t.category)}</div>
    <h2>${t.id} — ${escapeHtml(t.title)}</h2>
    <div class="scenario">${escapeHtml(t.scenario)}</div>
    <div class="grid">
      <div class="key">Data / Seed</div><div class="val">${escapeHtml(t.seed)}</div>
      <div class="key">Expected</div><div class="val">${escapeHtml(t.expected)}</div>
      <div class="key">Got</div><div class="val ${t.pass ? 'ok':'bad'}">${escapeHtml(t.got)}</div>
    </div>
    <div class="verdict ${t.pass ? 'pass':'fail'}">
      <strong>${t.pass ? '✓ PASS' : '✗ FAIL'}</strong> — ${t.pass
          ? 'observed value matches the expected value.'
          : 'observed value does NOT match the expected value.'}
    </div>
    ${t.notes ? '<div class="notes"><strong>Notes:</strong> ' + escapeHtml(t.notes) + '</div>' : ''}
  `;
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

render();
</script>
</body>
</html>
