<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inventory Ledger v6 — Simulator Test Report</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #1f2937; background: #f3f4f6; }
  header { background: #0f172a; color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .meta { font-size: 12px; opacity: 0.8; }
  .summary { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 12px 20px; display: flex; gap: 24px; align-items: center; }
  .stat { display: flex; flex-direction: column; }
  .stat .num { font-size: 22px; font-weight: 700; }
  .stat .label { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat.pass .num { color: #15803d; }
  .stat.fail .num { color: #b91c1c; }
  .layout { display: flex; height: calc(100vh - 110px); }
  .tree { width: 440px; background: #fff; border-right: 1px solid #e5e7eb; overflow-y: auto; padding: 12px 0; }
  .tree .cat { padding: 8px 16px; font-weight: 600; font-size: 13px; cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f3f4f6; }
  .tree .cat:hover { background: #f9fafb; }
  .tree .cat .arrow { font-size: 10px; color: #9ca3af; transition: transform 0.15s; }
  .tree .cat.collapsed .arrow { transform: rotate(-90deg); }
  .tree .cat .count { font-size: 11px; color: #6b7280; font-weight: 500; }
  .tree .cat .count .p { color: #15803d; }
  .tree .cat .count .f { color: #b91c1c; }
  .tree .tests { list-style: none; padding: 0; margin: 0; }
  .tree .cat.collapsed + .tests { display: none; }
  .tree .test { padding: 8px 16px 8px 28px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; border-left: 3px solid transparent; }
  .tree .test:hover { background: #f9fafb; }
  .tree .test.active { background: #eff6ff; border-left-color: #2563eb; }
  .tree .test .id { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-size: 11px; color: #6b7280; min-width: 38px; }
  .tree .test .label { flex: 1; color: #374151; line-height: 1.35; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 600; letter-spacing: 0.3px; }
  .badge.pass { background: #dcfce7; color: #15803d; }
  .badge.fail { background: #fee2e2; color: #b91c1c; }
  .detail { flex: 1; overflow-y: auto; padding: 28px 36px; }
  .detail .empty { color: #9ca3af; font-size: 14px; text-align: center; padding: 80px 0; }
  .detail h2 { margin: 0 0 4px; font-size: 22px; }
  .detail .category-tag { display: inline-block; background: #eef2ff; color: #4338ca; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
  .detail .what { font-size: 14px; color: #4b5563; margin-bottom: 22px; line-height: 1.55; }
  .detail .grid { display: grid; grid-template-columns: 170px 1fr; gap: 14px 18px; background: #fff; padding: 20px 24px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 18px; }
  .detail .grid .key { font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.4px; padding-top: 2px; }
  .detail .grid .val { font-size: 13px; color: #1f2937; word-break: break-word; line-height: 1.55; }
  .detail .grid .val.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; }
  .detail .compare { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
  .detail .compare .title { background: #f9fafb; padding: 10px 16px; font-size: 11px; font-weight: 600; color: #374151; text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 1px solid #e5e7eb; }
  .detail .compare table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .detail .compare th, .detail .compare td { padding: 10px 16px; text-align: left; border-bottom: 1px solid #f3f4f6; }
  .detail .compare th { background: #fff; font-weight: 600; color: #374151; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
  .detail .compare td.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; }
  .detail .compare td.ok { color: #166534; font-weight: 500; }
  .detail .compare td.bad { color: #991b1b; font-weight: 500; }
  .detail .verdict { font-size: 14px; padding: 14px 20px; border-radius: 8px; }
  .detail .verdict.pass { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
  .detail .verdict.fail { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
  .detail .notes { margin-top: 18px; padding: 14px 18px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; font-size: 13px; color: #78350f; line-height: 1.5; }
  .filterbar { padding: 8px 16px; border-bottom: 1px solid #f3f4f6; }
  .filterbar input { width: 100%; padding: 6px 10px; font-size: 13px; border: 1px solid #d1d5db; border-radius: 6px; outline: none; }
  .filterbar input:focus { border-color: #2563eb; }
</style>
</head>
<body>
<header>
  <h1>Inventory Ledger v6 — Simulator Test Report</h1>
  <div class="meta">Run 2026-06-17 · postgres:18-alpine · customer backup + alter_01/02/03 · 21 scenarios</div>
</header>

<div class="summary">
  <div class="stat"><span class="num" id="totalNum">21</span><span class="label">Tests</span></div>
  <div class="stat pass"><span class="num" id="passNum">21</span><span class="label">Pass</span></div>
  <div class="stat fail"><span class="num" id="failNum">0</span><span class="label">Fail</span></div>
  <div class="stat"><span class="num" id="catNum">5</span><span class="label">Categories</span></div>
</div>

<div class="layout">
  <aside class="tree" id="tree">
    <div class="filterbar"><input id="filter" placeholder="Filter tests..." type="text"></div>
  </aside>
  <main class="detail" id="detail">
    <div class="empty">Select a test on the left to view details.</div>
  </main>
</div>

<script>
const TESTS = [
  // ── Reservation lifecycle ───────────────────────────────────────────────
  { id: "TC01", category: "Reservation lifecycle",
    title: "Order placed — reservation taken (no shipment yet)",
    what: "Simplest end-to-end flow: load an opening balance, place an order, see the reservation land on stock_balance. ATP drops by the order qty.",
    product: "PROD_TC01", subinv: "ONHAND",
    seed: "opening_balance qty=100",
    did:  "Inserted opening_balance=100 → stock_balance.on_hand=100. Inserted staging.order_inbox with one line qty=15. Promote trigger created sfdc_order_line; reservation_apply trigger set reserved=15.",
    base: { exp: {on_hand:"100", reserved:"15", atp:"85", line_state:"open"},
            got: {on_hand:"100", reserved:"15", atp:"85", line_state:"open"} },
    pass: true },

  { id: "TC02", category: "Reservation lifecycle",
    title: "Partial shipment — 5 of 15 shipped, line stays open",
    what: "Verifies that a shipment for less than the order qty decrements both on_hand and reserved, and that the order line stays open with shipped_qty bumped.",
    product: "PROD_TC02", subinv: "ONHAND",
    seed: "opening_balance qty=100, order qty=15",
    did:  "Inserted txn_inbox signed_qty=-5 with erp_line_id pointing at the order line. Cascade decremented on_hand by 5 and recomputed reservation to (15-5)=10.",
    base: { exp: {on_hand:"95", reserved:"10", atp:"85", line_state:"open"},
            got: {on_hand:"95", reserved:"10", atp:"85", line_state:"open"} },
    pass: true },

  { id: "TC03", category: "Reservation lifecycle",
    title: "Full shipment — line closes, reservation cleared",
    what: "Complete fulfilment: full ship closes the line, residual reservation released. ATP comes back to (on_hand − 0).",
    product: "PROD_TC03", subinv: "ONHAND",
    seed: "opening_balance qty=100, order qty=15",
    did:  "Inserted txn_inbox signed_qty=-15. Cascade set shipped_qty=15, flipped line_state to closed, reservation_apply released the residual.",
    base: { exp: {on_hand:"85", reserved:"0", atp:"85", line_state:"closed"},
            got: {on_hand:"85", reserved:"0", atp:"85", line_state:"closed"} },
    pass: true },

  // ── Edge cases ───────────────────────────────────────────────────────────
  { id: "TC04", category: "Edge cases",
    title: "Oversell — order qty exceeds on_hand (ATP turns negative)",
    what: "Verifies that the reservation trigger does NOT block an order exceeding available stock. The order is accepted; ATP shows the shortfall as a negative number — the signal to downstream allocation systems.",
    product: "PROD_TC04", subinv: "ONHAND",
    seed: "opening_balance qty=30",
    did:  "Inserted order line qty=50 against on_hand=30. Trigger reserved the full 50.",
    base: { exp: {on_hand:"30", reserved:"50", atp:"-20", line_state:"open"},
            got: {on_hand:"30", reserved:"50", atp:"-20", line_state:"open"} },
    pass: true },

  { id: "TC05", category: "Edge cases",
    title: "ATP=0 boundary — reserved exactly equals on_hand",
    what: "Verifies the boundary case: when reservations consume every available unit, ATP must be exactly 0 (no rounding artefacts).",
    product: "PROD_TC05", subinv: "ONHAND",
    seed: "opening_balance qty=50",
    did:  "Inserted order line qty=50, no shipment.",
    base: { exp: {on_hand:"50", reserved:"50", atp:"0", line_state:"open"},
            got: {on_hand:"50", reserved:"50", atp:"0", line_state:"open"} },
    pass: true },

  { id: "TC06", category: "Edge cases",
    title: "Cancelled-at-insert line — no reservation taken",
    what: "Verifies that an order line submitted with line_state='cancelled' contributes ZERO to reservation. Only states {open, synced} reserve.",
    product: "PROD_TC06", subinv: "ONHAND",
    seed: "opening_balance qty=40",
    did:  "Inserted order line qty=10 with line_state='cancelled'. NEW_target=0 because state is not active.",
    base: { exp: {on_hand:"40", reserved:"0", atp:"40", line_state:"cancelled"},
            got: {on_hand:"40", reserved:"0", atp:"40", line_state:"cancelled"} },
    pass: true },

  { id: "TC07", category: "Edge cases",
    title: "Order for a product with no opening balance — stock_balance auto-created",
    what: "An order arrives for a product the OB file did not mention. Reservation trigger lazily creates stock_balance with on_hand=0 and reserved=order_qty → ATP negative. Downstream consumers see the shortfall immediately.",
    product: "PROD_TC07", subinv: "ONHAND",
    seed: "no opening_balance row (only the product master)",
    did:  "Inserted order line qty=20. reservation_apply found no existing stock_balance row, fell through to the INSERT branch, seeded the row with on_hand=0, reserved=20.",
    base: { exp: {on_hand:"0", reserved:"20", atp:"-20", line_state:"open"},
            got: {on_hand:"0", reserved:"20", atp:"-20", line_state:"open"} },
    pass: true,
    notes: "fetch_inventory_json returns this row with atp_qty=-20, so the shortfall is observable without special handling." },

  { id: "TC08", category: "Edge cases",
    title: "Overship — shipped more than on_hand (on_hand goes negative)",
    what: "Verifies that an ERP-recorded shipment for more units than we hold still applies. on_hand goes below zero AND the line closes (shipped_qty ≥ qty). Source of truth is the ledger; reconcile via opening_balance refresh later.",
    product: "PROD_TC08", subinv: "ONHAND",
    seed: "opening_balance qty=20, order qty=20",
    did:  "Inserted txn_inbox signed_qty=-25. on_hand became -5. Cascade bumped shipped_qty to 25 ≥ qty=20 → line closed.",
    base: { exp: {on_hand:"-5", reserved:"0", atp:"-5", line_state:"closed"},
            got: {on_hand:"-5", reserved:"0", atp:"-5", line_state:"closed"} },
    pass: true,
    notes: "Negative on_hand is intentional. recalculate_stock_balance rebuilds from a fresh opening_balance file later." },

  { id: "TC09", category: "Edge cases",
    title: "Empty-string subinventory accepted as a real key",
    what: "Verifies that subinventory='' (the schema default) is a valid key value. Reservations land on the empty-string row exactly like any named subinventory.",
    product: "PROD_TC09", subinv: "'' (empty string)",
    seed: "opening_balance qty=70 with subinventory=''",
    did:  "Inserted order line qty=15 with subinventory=''.",
    base: { exp: {on_hand:"70", reserved:"15", atp:"55", line_state:"open"},
            got: {on_hand:"70", reserved:"15", atp:"55", line_state:"open"} },
    pass: true },

  { id: "TC10", category: "Edge cases",
    title: "Alternate subinventory (STAGING) tracked independently",
    what: "Verifies that the (subinventory, stock_status) dimensions partition stock_balance — events on STAGING do not affect ONHAND for the same product.",
    product: "PROD_TC10", subinv: "STAGING",
    seed: "opening_balance qty=80 on STAGING, order qty=20, ship 5",
    did:  "Inserted OB, order, and ship — all bound to STAGING.",
    base: { exp: {on_hand:"75", reserved:"15", atp:"60", line_state:"open"},
            got: {on_hand:"75", reserved:"15", atp:"60", line_state:"open"} },
    pass: true },

  // ── Transaction types ──────────────────────────────────────────────────
  { id: "TC11", category: "Transaction types",
    title: "Full shipment then partial return — on_hand back up, line stays closed",
    what: "Verifies the v6 returns model: a positive signed_qty txn linked to the order line increases on_hand but does NOT decrement shipped_qty or reopen the closed line. Returns are treated as independent inventory events.",
    product: "PROD_TC11", subinv: "ONHAND",
    seed: "opening_balance qty=100, order qty=15",
    did:  "Inserted txn signed_qty=-15 (closes line at on_hand=85), then a second txn signed_qty=+3 with the same erp_line_id (return). on_hand went 100 → 85 → 88. Line stayed closed.",
    base: { exp: {on_hand:"88", reserved:"0", atp:"88", line_state:"closed"},
            got: {on_hand:"88", reserved:"0", atp:"88", line_state:"closed"} },
    pass: true,
    notes: "If business requires returns to reopen / credit the order line, that's a future enhancement to f_stock_balance_txn_apply." },

  { id: "TC12", category: "Transaction types",
    title: "Partial shipment then order cancellation — residual reservation released",
    what: "Verifies the post-shipment cancellation path. Flipping the line to 'cancelled' after a partial ship releases the remaining reservation (qty − shipped_qty). on_hand stays where the ship left it.",
    product: "PROD_TC12", subinv: "ONHAND",
    seed: "opening_balance qty=100, order qty=15, ship 5",
    did:  "After OB + order + ship -5, reserved contribution was 10. UPDATE line_state to 'cancelled'. reservation_apply computed NEW_target=0 and released the 10.",
    base: { exp: {on_hand:"95", reserved:"0", atp:"95", line_state:"cancelled"},
            got: {on_hand:"95", reserved:"0", atp:"95", line_state:"cancelled"} },
    pass: true,
    notes: "In production the cancel comes via re-submitted SFDC order JSON with status='Cancelled'. The simulator drives it via direct UPDATE — same trigger code path." },

  { id: "TC13", category: "Transaction types",
    title: "Purchase receipt (no order) — on_hand increases via positive txn",
    what: "Verifies that a positive signed_qty txn with NO erp_line_id (supplier receipt) simply bumps on_hand. No order to cascade against; no reservation change.",
    product: "PROD_TC13", subinv: "ONHAND",
    seed: "opening_balance qty=50, no order",
    did:  "Inserted txn signed_qty=+30, no erp_line_id. Cascade gated by 'signed_qty < 0' did not fire. on_hand 50 → 80.",
    base: { exp: {on_hand:"80", reserved:"0", atp:"80", line_state:"—"},
            got: {on_hand:"80", reserved:"0", atp:"80", line_state:"—"} },
    pass: true },

  { id: "TC14", category: "Transaction types",
    title: "Inventory adjustment up — on_hand increases without an order",
    what: "Same shape as TC13 but framed as adjustment_in. The trigger doesn't read txn_type for routing — it dispatches purely on sign + presence of erp_line_id.",
    product: "PROD_TC14", subinv: "ONHAND",
    seed: "opening_balance qty=50, no order",
    did:  "Inserted txn signed_qty=+5 unlinked. on_hand 50 → 55.",
    base: { exp: {on_hand:"55", reserved:"0", atp:"55", line_state:"—"},
            got: {on_hand:"55", reserved:"0", atp:"55", line_state:"—"} },
    pass: true },

  { id: "TC15", category: "Transaction types",
    title: "Inventory adjustment down — on_hand decreases without cascade",
    what: "Negative txn with NO erp_line_id decrements on_hand WITHOUT trying to match any order line. The 'IF NEW.erp_line_id IS NOT NULL' branch is skipped.",
    product: "PROD_TC15", subinv: "ONHAND",
    seed: "opening_balance qty=50, no order",
    did:  "Inserted txn signed_qty=-5 unlinked. on_hand 50 → 45. Cascade did NOT fire.",
    base: { exp: {on_hand:"45", reserved:"0", atp:"45", line_state:"—"},
            got: {on_hand:"45", reserved:"0", atp:"45", line_state:"—"} },
    pass: true },

  // ── Inventory moves ────────────────────────────────────────────────────
  { id: "TC16", category: "Inventory moves",
    title: "Subinventory move ONHAND → STAGING (same warehouse)",
    what: "A two-leg inventory move: -10 leaves ONHAND, +10 arrives on STAGING within the same warehouse. The trigger treats each leg as an independent txn (no order to cascade). Source row drops by 10; destination row is auto-created with on_hand=10.",
    product: "PROD_TC16", subinv: "ONHAND → STAGING",
    seed: "opening_balance qty=100 on ONHAND",
    did:  "Leg 1: txn signed_qty=-10 on ONHAND → on_hand 100 → 90. Leg 2: txn signed_qty=+10 on STAGING → row auto-created with on_hand=10.",
    base: { exp: {on_hand:"90", reserved:"0", atp:"90", line_state:"—"},
            got: {on_hand:"90", reserved:"0", atp:"90", line_state:"—"} },
    dest: { loc: "WH-SIM / STAGING / LIBERATED",
            exp: {on_hand:"10", reserved:"0"},
            got: {on_hand:"10", reserved:"0"} },
    pass: true },

  { id: "TC17", category: "Inventory moves",
    title: "Inter-warehouse move WH-SIM → WH-DEST",
    what: "A move across warehouses: -10 leaves WH-SIM/ONHAND, +10 arrives on WH-DEST/ONHAND. The destination warehouse is auto-created if missing. Validates that the stock_balance partition key includes warehouse_id.",
    product: "PROD_TC17", subinv: "WH-SIM/ONHAND → WH-DEST/ONHAND",
    seed: "opening_balance qty=100 on WH-SIM/ONHAND",
    did:  "Leg 1: -10 on WH-SIM/ONHAND. Leg 2: +10 on WH-DEST/ONHAND (warehouse master auto-created beforehand).",
    base: { exp: {on_hand:"90", reserved:"0", atp:"90", line_state:"—"},
            got: {on_hand:"90", reserved:"0", atp:"90", line_state:"—"} },
    dest: { loc: "WH-DEST / ONHAND / LIBERATED",
            exp: {on_hand:"10", reserved:"0"},
            got: {on_hand:"10", reserved:"0"} },
    pass: true },

  { id: "TC18", category: "Inventory moves",
    title: "Stock-status change LIBERATED → BLOCKED (QC hold)",
    what: "Reclassifies 10 units from LIBERATED to BLOCKED without physically moving them. Same warehouse, same subinv, just a different stock_status — which is part of the stock_balance primary key, so it produces a separate row.",
    product: "PROD_TC18", subinv: "ONHAND (LIBERATED → BLOCKED)",
    seed: "opening_balance qty=100 on ONHAND/LIBERATED",
    did:  "Leg 1: -10 on ONHAND/LIBERATED. Leg 2: +10 on ONHAND/BLOCKED. Destination row auto-created with the new status key.",
    base: { exp: {on_hand:"90", reserved:"0", atp:"90", line_state:"—"},
            got: {on_hand:"90", reserved:"0", atp:"90", line_state:"—"} },
    dest: { loc: "WH-SIM / ONHAND / BLOCKED",
            exp: {on_hand:"10", reserved:"0"},
            got: {on_hand:"10", reserved:"0"} },
    pass: true,
    notes: "BLOCKED stock is invisible to LIBERATED reservations (the trigger's WHERE clause matches stock_status exactly)." },

  { id: "TC19", category: "Inventory moves",
    title: "Multi-line order on same product — cumulative reservation",
    what: "One order with two lines for the same product on the same subinv. Each line reserves independently; stock_balance.reserved is the SUM. Validates that the reservation accumulator handles N lines correctly.",
    product: "PROD_TC19", subinv: "ONHAND",
    seed: "opening_balance qty=100",
    did:  "Inserted one order_inbox with TWO line objects: line 1 qty=10, line 2 qty=15. Both erp_external_ids land in sfdc_order_line; reservation_apply fires once per line.",
    base: { exp: {on_hand:"100", reserved:"25", atp:"75", line_state:"open"},
            got: {on_hand:"100", reserved:"25", atp:"75", line_state:"open"} },
    pass: true },

  // ── Concurrency / race conditions ──────────────────────────────────────
  { id: "TC20", category: "Concurrency / race",
    title: "Concurrent shipments against the same line",
    what: "5 threads each open their own JDBC connection and insert one shipment (-4) against the same order line concurrently. Tests PostgreSQL row-level locking in f_stock_balance_txn_apply: all 5 must apply, shipped_qty must sum to 20, and the line must close exactly once.",
    product: "PROD_TC20", subinv: "ONHAND",
    seed: "opening_balance qty=100, order qty=20 (single line, open)",
    did:  "Spawned 5 threads via ExecutorService. Each inserted staging.txn_inbox with a unique external_txn_id (SIM_<batch>_TC20_T1..T5) but the same erp_line_id. PostgreSQL serialized the line UPDATEs via row lock. All 5 inv_transaction rows landed; shipped_qty went 0→4→8→12→16→20; line closed exactly when the cumulative hit 20.",
    base: { exp: {on_hand:"80", reserved:"0", atp:"80", line_state:"closed"},
            got: {on_hand:"80", reserved:"0", atp:"80", line_state:"closed"} },
    pass: true,
    notes: "Verified in DB after the run: 5 inv_transaction rows for TC20 + shipped_qty=20 on ERP_LINE_TC20. The cascade serialized correctly under contention." },

  { id: "TC21", category: "Concurrency / race",
    title: "Concurrent orders for the same product",
    what: "5 threads each insert a separate order (qty=10) for the same product into staging.order_inbox concurrently. Tests that promote_one_order is safe under parallel inbox inserts: 5 separate sfdc_orders should appear and reservations should sum cleanly to 50.",
    product: "PROD_TC21", subinv: "ONHAND",
    seed: "opening_balance qty=100, no primary order",
    did:  "Spawned 5 threads. Each inserted staging.order_inbox with unique sfdc_order_id (SIM_<batch>_TC21_C1..C5) for the same product/subinv. Each AFTER-INSERT trigger fired promote_one_order on its own row. 5 distinct sfdc_orders + 5 distinct sfdc_order_lines created. The reservation_apply UPDATE on stock_balance serialized via row lock — final reserved=50.",
    base: { exp: {on_hand:"100", reserved:"50", atp:"50", line_state:"—"},
            got: {on_hand:"100", reserved:"50", atp:"50", line_state:"—"} },
    pass: true,
    notes: "Verified in DB: 5 sfdc_order rows + 5 sfdc_order_line rows for TC21. The promote_one_order path is safe under concurrent inbox inserts." }
];

const CATEGORY_ORDER = [
  "Reservation lifecycle",
  "Edge cases",
  "Transaction types",
  "Inventory moves",
  "Concurrency / race"
];

function render() {
  const tree = document.getElementById("tree");
  const filterEl = document.getElementById("filter");
  const q = filterEl.value.trim().toLowerCase();

  const grouped = {};
  for (const cat of CATEGORY_ORDER) grouped[cat] = [];
  for (const t of TESTS) {
    if (q && !(t.id.toLowerCase().includes(q)
              || t.title.toLowerCase().includes(q)
              || t.category.toLowerCase().includes(q)
              || t.what.toLowerCase().includes(q))) continue;
    if (!grouped[t.category]) grouped[t.category] = [];
    grouped[t.category].push(t);
  }

  let html = '<div class="filterbar"><input id="filter" placeholder="Filter tests..." type="text" value="' +
             escapeHtml(filterEl.value) + '"></div>';
  for (const cat of CATEGORY_ORDER) {
    const items = grouped[cat] || [];
    if (q && items.length === 0) continue;
    const pass = items.filter(t => t.pass).length;
    const fail = items.length - pass;
    html += `<div class="cat" data-cat="${cat}">
              <span><span class="arrow">▼</span> ${cat}</span>
              <span class="count"><span class="p">${pass}✓</span>${fail ? ' <span class="f">'+fail+'✗</span>' : ''}</span>
            </div>`;
    html += '<ul class="tests">';
    for (const t of items) {
      html += `<li class="test" data-id="${t.id}">
                 <span class="id">${t.id}</span>
                 <span class="label">${escapeHtml(t.title)}</span>
                 <span class="badge ${t.pass ? 'pass':'fail'}">${t.pass ? 'PASS':'FAIL'}</span>
               </li>`;
    }
    html += '</ul>';
  }
  tree.innerHTML = html;

  document.getElementById("filter").addEventListener("input", e => render());
  tree.querySelectorAll(".cat").forEach(el => {
    el.addEventListener("click", () => el.classList.toggle("collapsed"));
  });
  tree.querySelectorAll(".test").forEach(el => {
    el.addEventListener("click", () => {
      tree.querySelectorAll(".test.active").forEach(a => a.classList.remove("active"));
      el.classList.add("active");
      showDetail(el.dataset.id);
    });
  });

  document.getElementById("totalNum").textContent = TESTS.length;
  document.getElementById("passNum").textContent = TESTS.filter(t => t.pass).length;
  document.getElementById("failNum").textContent = TESTS.filter(t => !t.pass).length;
  document.getElementById("catNum").textContent = new Set(TESTS.map(t => t.category)).size;
}

function showDetail(id) {
  const t = TESTS.find(x => x.id === id);
  if (!t) return;
  const det = document.getElementById("detail");
  det.innerHTML = `
    <div class="category-tag">${escapeHtml(t.category)}</div>
    <h2>${t.id} — ${escapeHtml(t.title)}</h2>
    <div class="what">${escapeHtml(t.what)}</div>

    <div class="grid">
      <div class="key">Product</div><div class="val mono">${escapeHtml(t.product)}</div>
      <div class="key">Subinventory</div><div class="val mono">${escapeHtml(t.subinv)}</div>
      <div class="key">Seed / setup</div><div class="val">${escapeHtml(t.seed)}</div>
      <div class="key">What we did</div><div class="val">${escapeHtml(t.did)}</div>
    </div>

    ${compareTable("Source row — " + t.product, t.base)}
    ${t.dest ? compareTable("Destination row — " + t.dest.loc, t.dest) : ""}

    <div class="verdict ${t.pass ? 'pass':'fail'}">
      <strong>${t.pass ? '✓ PASS' : '✗ FAIL'}</strong> — ${t.pass
          ? 'all observed values match the expected values for this scenario.'
          : 'one or more observed values do NOT match the expected values.'}
    </div>
    ${t.notes ? '<div class="notes"><strong>Notes:</strong> ' + escapeHtml(t.notes) + '</div>' : ''}
  `;
}

function compareTable(title, block) {
  const exp = block.exp, got = block.got;
  const keys = Object.keys(exp);
  let rows = '';
  for (const k of keys) {
    const e = String(exp[k]);
    const g = String(got[k]);
    const m = e === g;
    rows += `<tr>
      <td>${k}</td>
      <td class="mono">${escapeHtml(e)}</td>
      <td class="mono ${m ? 'ok' : 'bad'}">${escapeHtml(g)}</td>
      <td>${m ? '✓' : '✗'}</td>
    </tr>`;
  }
  return `<div class="compare">
    <div class="title">${escapeHtml(title)}</div>
    <table>
      <thead><tr><th>Metric</th><th>Expected</th><th>Got</th><th>Match</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

render();
</script>
</body>
</html>
