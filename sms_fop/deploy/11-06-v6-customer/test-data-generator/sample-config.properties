# Sample configuration for the Inventory Test Data Generator.
# Copy this file to local.properties, fill in real values, and pass
# --config local.properties on the command line.
#
# CLI flags ALWAYS override values from this file.

# Path to the parameters CSV (loader mode — InventoryTestDataLoader)
csv.path = sample-params.csv

# Path to the scenarios CSV (simulator mode — InventorySimulator)
scenarios.path = sample-scenarios.csv

# Where to write the per-scenario PASS/FAIL CSV (simulator mode)
report.path = sim-report.csv

# Database connection
db.url   = jdbc:postgresql://localhost:5432/inventoryledger
db.user  = inventoryledger
db.pass  = REPLACE_ME

# Generation ratios (loader mode only — 0.0 to 1.0)
orders.ratio = 0.5
ships.ratio  = 0.5

# Run identifier — all SIM_<tag>_* rows from one run share this tag
batch.tag = MORNING

# Optional — override tenant_code from CSV
# tenant = IFOPEUR

# Optional — delete prior batch with this tag before loading
clean = false
