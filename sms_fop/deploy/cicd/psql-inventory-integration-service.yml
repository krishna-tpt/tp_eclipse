# =============================================================================
#  psql-inventory-integration-service — per-environment overlay
#
#  Lives in the COUNTRY config-repository (branch = env), next to
#  common-service-configs.yml. Mounted into the pod at $CONFIG_DIR
#  (/opt/app/config) by the michca-java-service helm chart.
#
#  Read by ConfigLoader on top of application.yaml + application-prod.yaml
#  bundled inside the JAR.
#
#  Trust boundary: this repo is access-controlled per env — credentials live
#  in this file (same pattern as stock-on-hand-integration-service.yml),
#  NOT in K8s Secrets.
#
#  IMPORTANT: this service is a plain Java 21 daemon — NOT Spring Boot.
#  Common-service-configs.yml spring.* / kafka.* / management.* keys are
#  inert for us and safe to ignore at the country level.
# =============================================================================

# ---------- runtime shape ----------------------------------------------------
app:
  profile: prod
  run_mode: scheduled          # scheduled | oneshot

# ---------- schedule (Europe/Amsterdam) --------------------------------------
schedule:
  # Michelin daily opening-balance drop lands ~05:30 local — poll at 06:00.
  daily_cron:  "0 6 * * *"
  # Hourly sweep for transactions / sales-orders / late arrivals.
  hourly_cron: "5 * * * *"

# ---------- health endpoint (K8s probes) -------------------------------------
health:
  host: "0.0.0.0"
  port: 8080

# ---------- database ---------------------------------------------------------
# Same pattern as stock-on-hand-integration-service.yml — creds are inline,
# not env-var-injected. Change per env branch (sandbox/dev/qa/pre-prod/prod).
db:
  url:      "jdbc:postgresql://dc10gbl0-postegredb-pg.postgres.database.azure.com/inventoryledger?sslmode=require"
  user:     "inventoryledger_app"
  password: "1nvent0ryledger"
  schema:   "processed"
  pool:
    max_size:           10
    min_idle:           2
    idle_timeout_ms:    600000
    connect_timeout_ms: 10000

# ---------- flyway (disabled — customer DBA owns schema) --------------------
flyway:
  enabled: false

# ---------- inbound file source (SFTP) ---------------------------------------
file:
  source:       sftp                                        # was: filescom
  name_pattern: "^MICH_INV_STOCKLEVEL_413\\d{14}\\.dat$"    # optional override

  sftp:
    host:      "filehub.michelin.net"                                # e.g. sftp.michelin.com
    port:      22
    username:  "DEV-BR-C10-EU"                                # supplied by Michelin

    # Public-key auth (preferred). The key file must be mounted into the pod
    # (see resource-repo / K8s secret) and readable by the JAR process user.
    private_key_path:       "/opt/app/secrets/sftp/id_rsa" # Change as per k8 pod
    private_key_passphrase: ""                              # blank if key has no passphrase

    # Pin the server host key (drop the SFTP host's public key here).
    known_hosts_path: "/opt/app/secrets/sftp/known_hosts" # Change as per k8 pod

    pickup_path:  "/EU/PRD/BR/C10/Inbound"
    archive_path: "/EU/PRD/BR/C10/Archive"
    reject_path:  "/EU/PRD/BR/C10/Error"

    connect_timeout_ms: 10000

# ---------- webhook notifier -------------------------------------------------
notifier:
  url:    "https://qc10gbl0-webhooks.michelin.internal/inventory/notify"
  secret: "REPLACE-ME-PER-ENV"   # HMAC — optional; leave blank to disable signing
  connect_timeout_ms: 5000
  read_timeout_ms:    15000
  outbox:
    drain_interval_ms: 30000
    max_retries:       5

# ---------- job defaults -----------------------------------------------------
job:
  batch_size:  1000
  parallelism: 1
  fail_fast:   false

# ---------- logging ----------------------------------------------------------
# Path convention matches common-service-configs.yml (/tmp/log/michca/...).
logging:
  level:  INFO
  format: json                 # json | text
  file:   "/tmp/log/michca/psql-inventory-integration-service.log"
