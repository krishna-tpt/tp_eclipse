# =============================================================================
# Inventory Ledger — Kubernetes env-injection example
#
# Reference manifests showing how to hand the JAR the env vars listed in
# `.env.example` (repo root). Splits secrets from non-secrets:
#   - Secret      → DB_PASSWORD, FILES_COM_API_KEY, WEBHOOK_URL_PRIMARY
#   - ConfigMap   → everything else (paths, URLs, timeouts, profile)
#
# Ops territory per ADR-0008 — copy/adapt, don't apply this folder as-is.
# Namespace, naming, image registry, image tag, replicas, scheduling — all
# yours to set per the customer's cluster conventions.
# =============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: inventoryledger-secrets
  namespace: inventoryledger          # CHANGE
type: Opaque
stringData:
  # Rotate via your secret manager (Vault / AKV / SealedSecrets / ESO).
  # DO NOT commit real values to a manifest in git.
  DB_PASSWORD:         "REPLACE_AT_DEPLOY"
  FILES_COM_API_KEY:   "REPLACE_AT_DEPLOY"
  WEBHOOK_URL_PRIMARY: "REPLACE_AT_DEPLOY"     # contains an auth token in the path

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventoryledger-config
  namespace: inventoryledger          # CHANGE
data:
  # --- App / DB (non-secret) ---
  APP_PROFILE: "prod"
  DB_URL:      "jdbc:postgresql://pg-flex.example.com:5432/inventoryledger?sslmode=require"
  DB_USER:     "inventoryledger_app"

  # --- File source ---
  FILE_SOURCE:               "filescom"
  FILES_COM_PICKUP_PATH:     "/michelin/stocklevel/inbox"
  FILES_COM_ARCHIVE_PATH:    "/michelin/stocklevel/archive"
  FILES_COM_REJECT_PATH:     "/michelin/stocklevel/reject"
  # Optional:
  # FILES_COM_BASE_URL:      "https://<acme>.files.com"
  # FILES_COM_PAGE_SIZE:     "200"
  # FILE_NAME_PATTERN:       "^opening_balance_\\d{8}\\.csv$"

  # --- Logging ---
  LOG_FORMAT: "json"
  LOG_LEVEL:  "INFO"

---
# Minimal Deployment that wires both into the container. Trim/extend per cluster
# norms — health probes, resources, image pull policy, node selectors, etc.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventoryledger
  namespace: inventoryledger          # CHANGE
spec:
  replicas: 1
  selector:
    matchLabels: { app: inventoryledger }
  template:
    metadata:
      labels: { app: inventoryledger }
    spec:
      containers:
        - name: inventoryledger
          image: <your-registry>/filemanager-core:<tag>   # CHANGE
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: inventoryledger-config }
            - secretRef:    { name: inventoryledger-secrets }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
