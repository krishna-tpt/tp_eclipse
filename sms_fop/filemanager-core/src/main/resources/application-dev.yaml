# Dev profile — local Postgres + local folder file source.
# Override individual values via env vars at runtime if needed.

profile: dev

# Dev defaults to one-shot — friction-free for local iteration. Override
# with RUN_MODE=scheduled when smoke-testing the scheduled path locally.
run_mode: ${RUN_MODE:oneshot}

db:
  url:      ${DB_URL:jdbc:postgresql://localhost:5432/inventoryledger?sslmode=disable}
  user:     ${DB_USER:postgres}
  password: ${DB_PASSWORD:postgres}

file:
  source: local
  local:
    pickup_path:  ${LOCAL_PICKUP_PATH:./inbound}
    archive_path: ${LOCAL_ARCHIVE_PATH:./archive}
    reject_path:  ${LOCAL_REJECT_PATH:./rejected}

notifier:
  webhook_urls:
    - ${WEBHOOK_URL_PRIMARY:http://localhost:8080/webhook}
  max_retries: 2
  timeout_ms:  2000

logging:
  format: text
  level:  DEBUG
