# Fixture for ConfigLoader tests. Minimal valid config.
# db.url uses a placeholder with default so TC-201 can override via env.
profile: test

db:
  url:      ${DB_URL:jdbc:postgresql://localhost:5432/inventoryledger?sslmode=disable}
  user:     il_app
  password: testpassword123
  connect_timeout_s:    5
  statement_timeout_ms: 30000

flyway:
  locations:           classpath:db/migration
  baseline_on_migrate: false
  validate_on_migrate: true

file:
  source: local
  name_pattern:  "^opening_balance_\\d{8}\\.csv$"
  local:
    pickup_path:  ./inbound
    archive_path: ./archive
    reject_path:  ./rejected

notifier:
  webhook_urls:
    - http://localhost:8080/webhook
  max_retries:      2
  timeout_ms:       1000
  retry_backoff_ms: 100
  batch_size:       10
  connect_timeout_ms: 1000

job:
  exit_on_first_failure: false
  drain_outbox: true
  temp_file_prefix: "ob-"
  timestamp_pattern: yyyyMMdd_HHmmss

logging:
  format: text
  level:  DEBUG
