interface: ACME_FEED
variant:   V1
version:   "1.0"
matches:
  filename_pattern: "^a$"
parser:
  delimiter: ";"
  quote:     "\""
  encoding:  UTF-8
envelope:
  - { tag: HEADER_FILE, fields: 1 }
records:
  - tag: ROW
    fields: 5
    target_table: staging.x
    columns:
      first_col:  { field: 1 }
      second_col: { field: 1 }   # same field number → must be rejected
