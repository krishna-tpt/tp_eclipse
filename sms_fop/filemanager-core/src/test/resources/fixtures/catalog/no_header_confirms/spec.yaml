interface: ACME_FEED
variant:   V1
version:   "1.0"

matches:
  filename_pattern: "^acme_.*\\.txt$"
  # no header_confirms — filename match alone should succeed

parser:
  delimiter: ";"
  quote:     "\""
  encoding:  UTF-8

envelope:
  - { tag: HEADER_FILE, fields: 3 }

records:
  - tag: ROW
    fields: 2
    target_table: staging.x
    columns:
      a_col: { field: 1 }
