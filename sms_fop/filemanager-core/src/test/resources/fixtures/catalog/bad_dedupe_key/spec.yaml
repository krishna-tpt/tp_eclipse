interface: MICH_INV_STOCKLEVEL
variant:   BATCH_DUPKEY
version:   "1.0"

# Negative fixture for CatalogLoader — dedupe_keys references a column the
# record never declares. The loader must reject this at startup, not at
# runtime when the first file arrives.

matches:
  filename_pattern: "^MICH_INV_STOCKLEVEL_BATCH_DUPKEY_\\d+\\.cfo$"
  header_confirms:
    record: HEADER_FILE
    field:  3
    equals: IFOPEUR

parser:
  delimiter: ";"
  quote:     "\""
  encoding:  UTF-8
  trim:      true
  empty_is_null: true
  decimal_separator: "."

envelope:
  - tag: HEADER_FILE
    fields: 3
    capture:
      source_system: { field: 3 }

records:
  - tag: MTL_STOCKLEVEL
    fields: 3
    target_table: staging.stocklevel_inbox
    dedupe_keys:
      - i_do_not_exist
    columns:
      tenant_code:   { from_envelope: HEADER_FILE, captured_as: source_system }
      item_segment1: { field: 2, required: true }
      warehouse:     { field: 3 }
