// =============================================================================
//  filemanager-core - production fat JAR.
//
//  Output: build/libs/psql-inventory-integration-service-1.0.0.jar
//  Main class: org.michelin.filemanager.App
//  The deployable artifact is emitted at the repository root build/libs folder
//  so the CI pipeline can pick it up from the root project path.
//
//  Matches the JAR path that the pipeline's dockerize stage expects and that
//  the Dockerfile COPY line reads. Do NOT rename without updating both.
// =============================================================================

plugins {
    id 'application'
    id 'jacoco'
}

dependencies {
    // -- Production --------------------------------------------------------
    implementation "org.postgresql:postgresql:${postgresVersion}"
    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    implementation "org.flywaydb:flyway-database-postgresql:${flywayVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"
    implementation "org.yaml:snakeyaml:${snakeyamlVersion}"
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"
    implementation "net.logstash.logback:logstash-logback-encoder:${logstashEncoderVersion}"
    implementation "org.apache.sshd:sshd-sftp:${sshdVersion}"
    implementation "com.files:files-sdk:${filesSdkVersion}"
    implementation "com.cronutils:cron-utils:${cronUtilsVersion}"

    // -- Test --------------------------------------------------------------
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
    testRuntimeOnly    "org.junit.platform:junit-platform-launcher"
}

application {
    mainClass = 'org.michelin.filemanager.App'
}

// -- Bundle shared /db/migration from repo root into the JAR -----------------
sourceSets {
    main {
        resources {
            srcDirs += rootProject.file('db/migration')
        }
    }
}

// Rename the /db/migration path inside the jar so Flyway finds classpath:db/migration.
// Achieved via a dedicated task that copies db/migration into main resources output.
processResources {
    from(rootProject.file('db/migration')) {
        into 'db/migration'
        include '**/*.sql'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// -- Fat JAR (equivalent of maven-shade-plugin) ------------------------------
// NOTE: we keep the standard `jar` task enabled so downstream subprojects
// (filemanager-data-tools depends on :filemanager-core) can consume the
// thin jar as a normal Gradle project dependency. The fat jar below is
// the DEPLOYABLE artifact - it uses its own name so the two don't collide.
jar {
    archiveClassifier = 'thin'
}

tasks.register('fatJar', Jar) {
    group       = 'build'
    description = 'Fat JAR with all runtime dependencies (produces the artifact the Dockerfile expects)'
    archiveBaseName = 'psql-inventory-integration-service'
    archiveVersion  = project.version
    archiveClassifier = ''
    destinationDirectory.set(rootProject.layout.buildDirectory.dir('libs'))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            'Main-Class': application.mainClass.get(),
            'Implementation-Title':   project.name,
            'Implementation-Version': project.version
        )
    }

    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.filter { it.name.endsWith('jar') }.collect { zipTree(it) }
    }

    // Drop signature files from included libraries (same as maven-shade filter).
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

build.dependsOn tasks.named('fatJar')

// -- Test config: mirror the surefire/failsafe split in the old pom ----------
test {
    // Unit tests only. Integration tests are excluded here and run by :integrationTest.
    exclude '**/integration/**'
    finalizedBy jacocoTestReport
}

tasks.register('integrationTest', Test) {
    group       = 'verification'
    description = 'Runs integration tests (src/test/java/**/integration/**)'
    include '**/integration/**Test.class'
    include '**/integration/**IT.class'
    shouldRunAfter test
    useJUnitPlatform()
}
check.dependsOn tasks.named('integrationTest')

// -- Coverage gates (kept intentionally light for now; tighten later) --------
jacoco {
    toolVersion = '0.8.12'
}
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
